name: Dropbox LARGE 2.2-7 GB imports and size report (TEST Series)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dropbox-oversized.yml
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch:
    inputs:
      max_gb:
        description: "Maximum large Dropbox recording size in GB (5 or 7)"
        type: choice
        options:
          - '5'
          - '7'
        default: '7'

permissions:
  contents: read

jobs:
  sizes:
    name: Count files above 2.2, 5 and 7 GB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata-only scanner dependencies
        run: python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Validate large-file selection and disk safety
        run: |
          python -m py_compile dropbox_large.py dropbox_import.py dropbox_size_report.py
          python -m unittest discover -s tests -p 'test_dropbox_large.py' -v
      - name: Report which files do not fit 5 GB and 7 GB
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
        run: python -u dropbox_size_report.py

  large-import:
    name: Large import ${{ matrix.source_key }} (2.2-${{ inputs.max_gb || '7' }} GB)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_key: gamliel
            source_label: 'Reb Gamliel Rabinowitz'
          - source_key: leil-shishi
            source_label: 'Reb Mielech - Leil Shishi'
          - source_key: short-word
            source_label: 'Reb Mielech - Short Word for Shabbos'
    # Same per-source lock as the normal importer. Never overwrite a
    # source's private Drive map while its regular worker is writing.
    concurrency:
      group: irgun-dropbox-source-${{ matrix.source_key }}
      cancel-in-progress: false
    env:
      DROPBOX_PROGRESS_DIR: /tmp/dropbox-import-progress
      SERIES_HLS_PRESET: ultrafast
      LARGE_LIMIT_GB: ${{ inputs.max_gb || '7' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reclaim optional runner software disk for large media
        run: |
          echo "Before cleanup:"
          df -h /tmp
          # Ephemeral runner only. Do not remove Python, FFmpeg or job files.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          echo "After cleanup:"
          df -h /tmp
      - name: Install FFmpeg and Drive client
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Verify oversized import safeguards
        run: |
          python -m py_compile dropbox_import.py dropbox_large.py dropbox_progress.py
          python -m unittest discover -s tests -p 'test_dropbox_large.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_parallel.py' -v
      - name: Import one 2.2-7 GB file; defer if disk insufficient
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SOURCE_LABEL: ${{ matrix.source_label }}
        run: |
          if [ "$LARGE_LIMIT_GB" != "5" ] && [ "$LARGE_LIMIT_GB" != "7" ]; then
            echo "::error::Only 5 GB and 7 GB limits are allowed."
            exit 1
          fi
          python -u dropbox_import.py --mode import --large-mode \
            --source-label "$SOURCE_LABEL" --max-files 1 \
            --min-source-bytes 2200000000 \
            --max-source-bytes "$((LARGE_LIMIT_GB * 1000000000))" \
            --reserve-gib 68
      - name: Show oversized import progress and skipped file counts
        if: always()
        run: python -u dropbox_progress.py --summary
      - name: Retain oversized run progress for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-large-progress-${{ matrix.source_key }}
          path: /tmp/dropbox-import-progress/
          if-no-files-found: ignore
          retention-days: 14
