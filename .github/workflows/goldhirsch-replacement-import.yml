name: Import Goldhirsch actual Parsha lecture (private test)

on:
  push:
    branches: [fix/goldhirsch-replace-nonlecture-sample]
    paths: [.github/workflows/goldhirsch-replacement-import.yml]

permissions:
  contents: read

concurrency:
  group: irgun-dropbox-shared-link-import
  cancel-in-progress: false

jobs:
  replace-sample:
    if: ${{ github.event.head_commit.message == 'IMPORT_GOLDHIRSCH_BEREISHIS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media and Google Drive dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Run exclusion and publishing tests
        run: |
          python -m py_compile dropbox_import.py dropbox_series_bridge.py dropbox_media_policy.py
          python -m unittest discover -s tests -p 'test_dropbox_import.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_series_bridge.py' -v
      - name: Import only Goldhirsch Parshas Bereishis, not Shinyev
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          test -n "$DROPBOX_SOURCES_JSON" || {
            echo "::error::DROPBOX_SOURCES_JSON is missing"; exit 1;
          }
          python -u dropbox_import.py --mode import \
            --source-label 'Reb Yitzchok Ahron Goldhirsch' \
            --only-id 'dbx-media-3df0bdb4b9e0158a92c44348' \
            --max-files 1 --min-video-bytes 40000000 \
            --max-source-bytes 650000000 --reserve-gib 50
          echo "Goldhirsch Parsha sample saved privately; no website approval granted."
