name: Vimeo HLS Backup

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum lectures to HLS-encode in this run"
        required: false
        default: "1"
      video_id:
        description: "Optional Vimeo ID to process only one lecture"
        required: false
        default: ""
      force_rebuild:
        description: "Rebuild HLS even if hls-map.json already marks it complete"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '47 */2 * * *'

permissions:
  contents: read

concurrency:
  group: vimeo-hls-backup
  cancel-in-progress: false

jobs:
  hls-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth

      - name: Prepare Google Drive OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os, pickle
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials

          raw = os.environ.get('GOOGLE_TOKEN_JSON', '').strip()
          if not raw:
              raise SystemExit('GOOGLE_TOKEN_JSON secret is missing')
          info = json.loads(raw)
          scopes = info.get('scopes') or ['https://www.googleapis.com/auth/drive']
          creds = Credentials.from_authorized_user_info(info, scopes=scopes)
          if creds.expired and creds.refresh_token:
              creds.refresh(Request())
          if not creds.valid:
              raise SystemExit('Google OAuth credentials are not valid')
          with open('token.pickle', 'wb') as handle:
              pickle.dump(creds, handle)
          PY

      - name: Run HLS backup
        env:
          INPUT_MAX_ITEMS: ${{ github.event.inputs.max_items }}
          INPUT_VIDEO_ID: ${{ github.event.inputs.video_id }}
          INPUT_FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          MAX_ITEMS="${INPUT_MAX_ITEMS:-1}"
          VIDEO_ID="${INPUT_VIDEO_ID:-}"
          FORCE_REBUILD="0"
          if [ "${INPUT_FORCE_REBUILD:-false}" = "true" ]; then
            FORCE_REBUILD="1"
          fi
          export HLS_MAX_ITEMS_PER_RUN="$MAX_ITEMS"
          export HLS_ONLY_VIDEO_ID="$VIDEO_ID"
          export HLS_FORCE_REBUILD="$FORCE_REBUILD"
          python -u hls_backup.py
