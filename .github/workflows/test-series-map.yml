name: Test Series catalog safety

on:
  pull_request:
    paths:
      - 'series_catalog.py'
      - 'series_drive.py'
      - 'series_ingest.py'
      - 'dropbox_series_bridge.py'
      - 'dropbox_media_policy.py'
      - 'tests/test_dropbox_series_bridge.py'
      - 'tests/test_dropbox_parallel.py'
      - 'tests/test_series_catalog.py'
      - '.github/workflows/series-map-hourly.yml'
      - '.github/workflows/test-series-map.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive test dependencies
        run: python -m pip install google-api-python-client google-auth google-auth-httplib2
      - run: python -m unittest discover -s tests -p 'test_series_catalog.py' -v
      - run: python -m unittest discover -s tests -p 'test_dropbox_series_bridge.py' -v
      - run: python -m unittest discover -s tests -p 'test_dropbox_parallel.py' -v
      - run: python -m py_compile series_catalog.py series_drive.py series_ingest.py dropbox_series_bridge.py
