name: Dropbox incremental import every 3 hours (TEST Series only)

on:
  schedule:
    # Every 3 hours (UTC); GitHub may delay scheduled starts.
    - cron: '11 */3 * * *'
  workflow_dispatch:
  push:
    # Start an initial check when this new workflow is merged to main.
    branches: [main]
    paths:
      - .github/workflows/dropbox-incremental-3h.yml

permissions:
  contents: read

jobs:
  incremental:
    name: Check new Dropbox recordings - ${{ matrix.source_key }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_key: gamliel
          - source_key: leil-shishi
          - source_key: short-word
    # Hold one lock for the ENTIRE small/medium/oversized pass for this source.
    # This is the same lock used by the old manual and large import workflows.
    concurrency:
      group: irgun-dropbox-source-${{ matrix.source_key }}
      cancel-in-progress: false
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      SERIES_HLS_PRESET: ultrafast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclaim optional disk space for large media
        run: |
          df -h /tmp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h /tmp
      - name: Install FFmpeg and Google Drive client
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Validate immutable 2301-ID history and importer safety
        run: |
          python -m py_compile dropbox_import_ledger.py dropbox_incremental.py dropbox_import.py dropbox_over7.py
          python -m unittest discover -s tests -p 'test_dropbox_incremental.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_import.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_large.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_over7.py' -v
      - name: Check Dropbox for new recordings and import each supported size tier
        run: |
          python -u dropbox_incremental.py --source-key "${{ matrix.source_key }}" --work-minutes 330
      - name: Summarise source-specific progress
        if: always()
        run: python -u dropbox_progress.py --summary
