name: Read-only Dropbox Series publication preflight

on:
  push:
    branches: [feature/dropbox-shared-link-import]
    paths: [.github/workflows/dropbox-series-preflight.yml]

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event.head_commit.message == 'PREFLIGHT_GAMLIEL_SERIES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Drive dependencies
        run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Authenticate without publishing anything
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os, pickle
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          info=json.loads(os.environ["GOOGLE_TOKEN_JSON"])
          creds=Credentials.from_authorized_user_info(info,
              scopes=info.get("scopes") or ["https://www.googleapis.com/auth/drive"])
          if creds.expired and creds.refresh_token: creds.refresh(Request())
          if not creds.valid: raise RuntimeError("Google Drive token is invalid")
          with open("token.pickle","wb") as f:pickle.dump(creds,f)
          PY
      - name: Validate approved Dropbox record against real Series source files
        run: |
          python - <<'PY'
          import json
          from series_drive import SeriesDrive
          from series_catalog import build_maps
          from dropbox_series_bridge import merge_approved_dropbox,series_id
          mid="dbx-media-b10df8d9b922db4b49f24e64"
          drive=SeriesDrive()
          baseline,private=build_maps(drive.list_source_files())
          manifest=drive.read_dropbox_import_map()
          if not manifest or manifest.get("items",{}).get(mid,{}).get("approved") is not True:
              raise RuntimeError("Requested test Dropbox video is not explicitly approved")
          pub,priv=merge_approved_dropbox(baseline,private,manifest)
          found=[x for x in pub["items"] if x.get("id")==series_id(mid)]
          if len(found)!=1 or len(pub["items"])!=len(baseline["items"])+1:
              raise RuntimeError("The single approved recording was not safely cataloged")
          item=found[0]
          if item.get("speaker")!="Reb Gamliel Rabinowitz" or item.get("year")!=5783:
              raise RuntimeError("Unexpected speaker or year in test entry")
          if not all(item.get(k) is True for k in ("videoReady","audioReady","hlsReady","posterReady")):
              raise RuntimeError("Test recording has incomplete playback outputs")
          public_json=json.dumps(pub,ensure_ascii=False)
          for secret_key in ("originalDriveId","masterDriveId","sourcePath","dropboxFileId","rlkey"):
              if '"'+secret_key+'"' in public_json:
                  raise RuntimeError("Private media metadata leaked: "+secret_key)
          print("PASS: read-only Series + Dropbox preflight, existing Series entries:",
                len(baseline["items"]),"new approved videos: 1")
          PY
