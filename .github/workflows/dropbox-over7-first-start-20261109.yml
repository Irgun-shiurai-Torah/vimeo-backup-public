name: One-time start - first over-7GB Short Word video

# Creating this workflow in the one uniquely named commit below is the
# one-time start signal. It has no schedule or workflow_dispatch trigger.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dropbox-over7-first-start-20261109.yml

permissions:
  contents: read

# Match the per-source lock of both the normal and 2.2-7GB importers.
concurrency:
  group: irgun-dropbox-source-short-word
  cancel-in-progress: false

jobs:
  first-oversized:
    # Do not import on later edits or on any manually re-run job.
    if: ${{ github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Start first oversized Dropbox import (one-shot)' && github.run_attempt == 1 }}
    name: One-time first Short Word video above 7 GB
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      SERIES_HLS_PRESET: ultrafast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclaim optional ephemeral disk capacity
        run: |
          df -h /tmp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h /tmp
      - name: Install Google Drive dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Run offline importer regressions
        run: |
          python -m py_compile dropbox_import.py dropbox_large.py dropbox_over7.py
          python -m unittest discover -s tests -p 'test_dropbox_over7.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_large.py' -v
      - name: Print approved over-7GB inventory (no writes)
        run: |
          python -u dropbox_over7.py --source-key short-word --mode plan
      - name: Import one smallest pending over-7GB Short Word recording
        run: |
          python -u dropbox_over7.py \
            --source-key short-word \
            --mode import \
            --confirm IMPORT_OVER_7_GB \
            --budget-minutes 300 \
            --max-renditions 4
