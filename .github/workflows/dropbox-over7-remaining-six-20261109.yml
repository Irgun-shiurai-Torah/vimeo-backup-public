name: One-time import of remaining 6 oversized Dropbox videos

# No schedule, no manual dispatch. Editing any other file cannot trigger it.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dropbox-over7-remaining-six-20261109.yml

permissions:
  contents: read

jobs:
  short_word_last:
    name: Short Word oversized video 2 of 2
    if: ${{ github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Start remaining six oversized Dropbox imports (one-shot)' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: irgun-dropbox-source-short-word
      cancel-in-progress: false
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      SERIES_HLS_PRESET: ultrafast
      SOURCE_KEY: short-word
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclaim disk on the ephemeral runner
        run: |
          df -h /tmp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h /tmp
      - name: Install media and Google client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Run offline safety and existing-import regression tests
        run: |
          python -m py_compile dropbox_import.py dropbox_large.py dropbox_over7.py
          python -m unittest discover -s tests -p 'test_dropbox_over7.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_large.py' -v
      - name: Import the next remaining >7-20 GB video and require full completion
        shell: bash
        run: |
          set -euo pipefail
          python -u dropbox_over7.py \
            --source-key "$SOURCE_KEY" \
            --mode import \
            --confirm IMPORT_OVER_7_GB \
            --budget-minutes 300 \
            --max-renditions 4 | tee /tmp/over7-import-result.log
          if grep -Fq 'OVERSIZE RESULT | paused' /tmp/over7-import-result.log; then
            echo "::error::An oversized import paused; saved Drive checkpoints are intact. Do not start the next lecture until resumed and finished."
            exit 1
          fi
          if grep -Fq 'OVERSIZE RESULT | complete' /tmp/over7-import-result.log || grep -Fq 'OVERSIZE DONE |' /tmp/over7-import-result.log; then
            echo "One oversized import completed or there were no eligible recordings."
          else
            echo "::error::Importer did not confirm completion. Stopping dependent jobs."
            exit 1
          fi

