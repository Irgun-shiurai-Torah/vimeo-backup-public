name: Dropbox shiurim import for test Series

on:
  schedule:
    # Process up to 20 completed recordings hourly (7 + 7 + 6 across approved sources).
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irgun-dropbox-shared-link-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DROPBOX_PROGRESS_DIR: ${{ runner.temp }}/dropbox-import-progress
      # Faster encoding, with the same bitrate and available HLS quality ladder.
      SERIES_HLS_PRESET: ultrafast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and Google Drive dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Confirm approved source list and import safety
        env:
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
        run: |
          test -n "$DROPBOX_SOURCES_JSON" || {
            echo "::error::DROPBOX_SOURCES_JSON is missing; no fallback to the trial link."
            exit 1
          }
          python -m py_compile dropbox_import.py dropbox_series_bridge.py
          python -m unittest discover -s tests -p 'test_dropbox_import.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_progress.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_series_bridge.py' -v
          python -m unittest discover -s tests -p 'test_series_visibility.py' -v
      - name: Import up to 20 recordings across approved Gamliel/Biderman collections
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        shell: bash
        run: |
          set -uo pipefail
          # Keep each collection isolated so one failure does not stop the others.
          # Rotate source order and the six-file share each hour. The total
          # limit is 7 + 7 + 6 = 20 files, not 20 files per source.
          # Only the two approved speakers are allowed in the Series importer.
          # Other shared folders remain available privately but are NOT
          # downloaded or published by this scheduled workflow.
          sources=(
            'Reb Gamliel Rabinowitz'
            'Reb Mielech - Leil Shishi'
            'Reb Mielech - Short Word for Shabbos'
          )
          slot=$(( 10#$(date -u +%H) % ${#sources[@]} ))
          batch_sizes=(7 7 6)
          failed=0
          for ((i=0;i<${#sources[@]};i++)); do
            index=$(( (slot + i) % ${#sources[@]} ))
            label="${sources[index]}"
            max_files="${batch_sizes[i]}"
            echo "::group::Dropbox import: $label (up to $max_files recordings)"
            if python -u dropbox_import.py --mode import \
              --source-label "$label" --max-files "$max_files" \
              --max-source-bytes 2200000000 --reserve-gib 50; then
              echo "::notice::Completed a safe Dropbox batch for $label."
            else
              echo "::error::Dropbox import paused or failed for $label. Other sources continue."
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed collection(s) require follow-up."
            exit 1
          fi
          echo "Finished private Drive imports. The hourly TEST Series scanner will"
          echo "automatically publish complete eligible shiurim; admins can hide any item."
      - name: Show final import progress and unfinished recording
        if: always()
        run: python -u dropbox_progress.py --summary
      - name: Save progress report for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-import-progress
          path: ${{ runner.temp }}/dropbox-import-progress/
          if-no-files-found: ignore
          retention-days: 14
