name: Dropbox shiurim import for test Series

on:
  schedule:
    # Three independently checkpointed sources, 7+7+6 recordings per hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keep an older single-worker import from overlapping the first new run.
# The three jobs inside this run are still allowed to execute in parallel.
concurrency:
  group: irgun-dropbox-shared-link-import
  cancel-in-progress: false

jobs:
  import:
    name: Import ${{ matrix.source_key }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - source_key: gamliel
            source_label: 'Reb Gamliel Rabinowitz'
            max_files: 7
          - source_key: leil-shishi
            source_label: 'Reb Mielech - Leil Shishi'
            max_files: 7
          - source_key: short-word
            source_label: 'Reb Mielech - Short Word for Shabbos'
            max_files: 6
    # Do not overlap two runs targeting the same source's private map.
    # Different sources now run concurrently on separate GitHub runners.
    concurrency:
      group: irgun-dropbox-source-${{ matrix.source_key }}
      cancel-in-progress: false
    env:
      DROPBOX_PROGRESS_DIR: /tmp/dropbox-import-progress
      SERIES_HLS_PRESET: ultrafast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and Google Drive dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Confirm approved source list and import safety
        env:
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
        run: |
          test -n "$DROPBOX_SOURCES_JSON" || {
            echo "::error::DROPBOX_SOURCES_JSON is missing; no fallback to the trial link."
            exit 1
          }
          python -m py_compile dropbox_import.py series_drive.py dropbox_series_bridge.py
          python -m unittest discover -s tests -p 'test_dropbox_import.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_parallel.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_progress.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_series_bridge.py' -v
          python -m unittest discover -s tests -p 'test_series_visibility.py' -v
      - name: Import ${{ matrix.source_label }} (up to ${{ matrix.max_files }})
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SOURCE_LABEL: ${{ matrix.source_label }}
          MAX_FILES: ${{ matrix.max_files }}
        run: |
          # Extra 18 GiB covers potential overlap of the other two workers.
          # This retains at least the original 50 GiB free-space reserve.
          python -u dropbox_import.py --mode import \
            --source-label "$SOURCE_LABEL" --max-files "$MAX_FILES" \
            --max-source-bytes 2200000000 --reserve-gib 68
      - name: Show latest progress for this collection
        if: always()
        run: python -u dropbox_progress.py --summary
      - name: Save source-specific progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-import-progress-${{ matrix.source_key }}
          path: /tmp/dropbox-import-progress/
          if-no-files-found: ignore
          retention-days: 14
