name: Series test-only media conversion

on:
  push:
    branches: [main]
    paths:
      - series_media.py
      - series_catalog.py
      - tests/test_series_media.py
      - .github/workflows/series-media.yml
  schedule:
    - cron: '31 */2 * * *'
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximum Series media files to convert in this run (1–20)"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: irgun-series-test-drive-map
  # The hourly catalog scan shares this group to protect its private map.
  # A converter code update must not cancel a folder scan already in progress.
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and existing Drive client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth google-auth-httplib2
      - name: Validate media-processing behavior
        run: python -m unittest discover -s tests -p 'test_series_media.py' -v
      - name: Authenticate existing backup Google account
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os, pickle
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          raw=os.environ.get("GOOGLE_TOKEN_JSON","").strip()
          if not raw:raise SystemExit("Existing GOOGLE_TOKEN_JSON secret is missing")
          info=json.loads(raw)
          creds=Credentials.from_authorized_user_info(info,scopes=info.get("scopes") or ["https://www.googleapis.com/auth/drive"])
          if creds.expired and creds.refresh_token:creds.refresh(Request())
          if not creds.valid:raise SystemExit("Google Drive credentials are invalid")
          with open("token.pickle","wb") as f:pickle.dump(creds,f)
          PY
      - name: Convert new Series video/audio without changing city workflows
        env:
          SERIES_DRIVE_ROOT_ID: 1B5myYj9rsqfoRO8Cjjr6CQOf-q2Q71Ft
          MAX_ITEMS_INPUT: ${{ github.event.inputs.max_items }}
        run: python -u series_media.py --limit "${MAX_ITEMS_INPUT:-20}"
      - name: Refresh safe public Series map after conversion
        env:
          SERIES_DRIVE_ROOT_ID: 1B5myYj9rsqfoRO8Cjjr6CQOf-q2Q71Ft
        run: python -u series_ingest.py
      - name: Publish updated public map
        run: python -c 'from series_media import publish_series_map_safely; publish_series_map_safely("Update staging Series processing status")'
