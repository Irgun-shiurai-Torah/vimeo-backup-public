name: Finish five Leil Shishi videos over 7 GB (one-time)

# This is a single-use push-triggered batch. No recurring schedule.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dropbox-over7-leil-fixed-20261109.yml

permissions:
  contents: read

# IMPORTANT: Hold the per-source lock across the ENTIRE workflow, not
# separately on each job. Otherwise an hourly importer replaces queued
# oversized jobs between renditions/videos (GitHub permits one pending run
# per concurrency group). DO NOT add matching job-level concurrency here:
# it would conflict with our own workflow-level lock.
concurrency:
  group: irgun-dropbox-source-leil-shishi
  cancel-in-progress: false

jobs:
  leil_1:
    name: Leil Shishi oversized video 1 of 5
    # The original push commit is the explicit one-time authorisation.
    # Re-running a failed job is permitted so checkpoints can resume.
    if: ${{ github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Start locked five-video Leil Shishi over7 import' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      SERIES_HLS_PRESET: ultrafast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclaim optional ephemeral disk space
        run: |
          df -h /tmp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h /tmp
      - name: Install FFmpeg and Drive dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Validate importer and safety regressions
        run: |
          python -m py_compile dropbox_import.py dropbox_large.py dropbox_over7.py
          python -m unittest discover -s tests -p 'test_dropbox_over7.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_large.py' -v
      - name: Import one pending oversized video and require a confirmed checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -u dropbox_over7.py \
            --source-key leil-shishi \
            --mode import \
            --confirm IMPORT_OVER_7_GB \
            --budget-minutes 300 \
            --max-renditions 4 | tee /tmp/over7-leil-result.log
          if grep -Fq 'OVERSIZE RESULT | complete |' /tmp/over7-leil-result.log; then
            echo "Video 1 committed to the private Drive source map"
          elif grep -Fq 'OVERSIZE DONE | no eligible unimported recordings' /tmp/over7-leil-result.log; then
            echo "No further eligible videos; prior checkpoint already complete"
          else
            echo "::error::Import did not confirm a full checkpoint. Downstream videos must not start."
            exit 1
          fi

