name: Series test-only Drive map (hourly)

on:
  push:
    branches: [main]
    paths:
      - series_catalog.py
      - series_drive.py
      - series_ingest.py
      - dropbox_series_bridge.py
      - dropbox_media_policy.py
      - series_visibility.py
      - tests/test_series_visibility.py
      - tests/test_dropbox_series_bridge.py
      - tests/test_dropbox_parallel.py
      - tests/test_series_catalog.py
      - .github/workflows/series-map-hourly.yml
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: irgun-series-test-drive-map
  cancel-in-progress: false

jobs:
  scan-series:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Drive OAuth dependencies
        run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Verify scanner logic
        run: python -m unittest discover -s tests -p 'test_series_catalog.py' -v
      - name: Verify Dropbox approval safety
        run: |
          python -m unittest discover -s tests -p 'test_dropbox_series_bridge.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_parallel.py' -v
      - name: Verify the two-speaker visibility restriction
        run: python -m unittest discover -s tests -p 'test_series_visibility.py' -v
      - name: Authenticate with the existing backup Google account
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json, os, pickle
          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          raw = os.environ.get("GOOGLE_TOKEN_JSON", "").strip()
          if not raw:
              raise SystemExit("Existing GOOGLE_TOKEN_JSON secret is missing")
          info = json.loads(raw)
          scopes = info.get("scopes") or ["https://www.googleapis.com/auth/drive"]
          creds = Credentials.from_authorized_user_info(info, scopes=scopes)
          if creds.expired and creds.refresh_token: creds.refresh(Request())
          if not creds.valid: raise SystemExit("Drive OAuth credentials are not valid")
          with open("token.pickle","wb") as handle: pickle.dump(creds,handle)
          PY
      # This scan also indexes empty speaker folders for the website dropdown.
      - name: Scan the separate Series speaker folders
        env:
          SERIES_DRIVE_ROOT_ID: 1B5myYj9rsqfoRO8Cjjr6CQOf-q2Q71Ft
        run: python series_ingest.py
      - name: Publish only the sanitized Series map
        run: |
          git config user.name "Irgun Series Importer"
          git config user.email "actions@users.noreply.github.com"
          cp series-public-map.json "$RUNNER_TEMP/series-public-map.json"
          # Other GitHub jobs can update main while the hourly Drive scan runs.
          # Start each attempt from the newest main, then stage ONLY the safe
          # generated catalog. Never force push or replace unrelated commits.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/series-public-map.json" series-public-map.json
            git add series-public-map.json
            if git diff --cached --quiet; then
              echo "Series catalog unchanged."
              exit 0
            fi
            git commit -m "Update staging Series catalog from Google Drive [skip ci]"
            if git push origin HEAD:main; then
              echo "Published Series map on attempt $attempt"
              exit 0
            fi
            echo "Series map publish raced with another commit, retrying on newest main"
          done
          echo "Could not publish Series map after 3 safe retries"
          exit 1
