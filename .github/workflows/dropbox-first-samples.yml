name: Dropbox sample recording from each collection

on:
  push:
    branches: [feature/dropbox-samples-biderman-priority]
    paths: [.github/workflows/dropbox-first-samples.yml]

permissions:
  contents: read

concurrency:
  group: irgun-dropbox-shared-link-import
  cancel-in-progress: false

jobs:
  first-samples:
    if: ${{ github.event.head_commit.message == 'RUN_FOUR_SAMPLE_IMPORTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media and Google Drive dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Check importer and privacy safeguards
        run: |
          python -m py_compile dropbox_import.py dropbox_series_bridge.py
          python -m unittest discover -s tests -p 'test_dropbox_import.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_series_bridge.py' -v
      - name: Import one video from each of the four untested collections
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        shell: bash
        run: |
          # Reb Gamliel Rabinowitz's one-video import already passed.
          # Each other collection is scanned and imported one at a time to
          # avoid concurrent edits overwriting the single private Drive map.
          failed=0
          for label in \
            'Reb Nachum Cohen' \
            'Reb Yitzchok Ahron Goldhirsch' \
            'Reb Mielech - Leil Shishi' \
            'Reb Mielech - Short Word for Shabbos'
          do
            echo "::group::Test sample from $label"
            if python -u dropbox_import.py --mode import --max-files 1 \
              --source-label "$label" --min-video-bytes 5000000; then
              echo "::notice title=Dropbox sample saved::One recording from $label imported into private Drive storage."
            else
              echo "::error title=Dropbox sample failed::Import from $label did not finish."
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "$failed of four sample collections need attention."
            exit 1
          fi
          echo "All four new collection samples imported into private Google Drive."
          echo "No new recordings approved for public or test website publication."
