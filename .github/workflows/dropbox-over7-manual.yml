name: Dropbox OVER 7 GB one-file import (TEST Series, manual only)

on:
  workflow_dispatch:
    inputs:
      source_key:
        description: Approved Dropbox source to process
        required: true
        type: choice
        options:
          - gamliel
          - short-word
          - leil-shishi
      mode:
        description: Dry-run plan or import one file
        required: true
        type: choice
        options:
          - plan
          - import
        default: plan
      confirm:
        description: For import, type IMPORT_OVER_7_GB exactly
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Share the same source lock as the 2.2 GB and 2.2-7 GB workers.
# Never overwrite a private source map during another worker's write.
concurrency:
  group: irgun-dropbox-source-${{ inputs.source_key }}
  cancel-in-progress: false

jobs:
  oversized:
    name: Checkpointed >7 GB import (${{ inputs.source_key }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_SOURCES_JSON: ${{ secrets.DROPBOX_SOURCES_JSON }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      SERIES_HLS_PRESET: ultrafast
      SOURCE_KEY: ${{ inputs.source_key }}
      IMPORT_MODE: ${{ inputs.mode }}
      IMPORT_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclaim ephemeral runner disk (import mode only)
        if: inputs.mode == 'import'
        run: |
          df -h /tmp
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h /tmp
      - name: Install client dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Run offline checks before any connection
        run: |
          python -m py_compile dropbox_over7.py dropbox_large.py dropbox_import.py
          python -m unittest discover -s tests -p 'test_dropbox_over7.py' -v
          python -m unittest discover -s tests -p 'test_dropbox_large.py' -v
      - name: Plan or import one approved oversized recording
        run: |
          python -u dropbox_over7.py \
            --source-key "$SOURCE_KEY" \
            --mode "$IMPORT_MODE" \
            --confirm "$IMPORT_CONFIRM" \
            --budget-minutes 300 \
            --max-renditions 4
