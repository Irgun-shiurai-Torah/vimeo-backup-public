name: Approve one Reb Gamliel recording for TEST Series

on:
  push:
    branches: [feature/dropbox-shared-link-import]
    paths: [.github/workflows/dropbox-first-preview.yml]

permissions:
  contents: read

jobs:
  approve:
    # Only a deliberately named one-time commit can approve this specific item.
    if: ${{ github.event.head_commit.message == 'APPROVE_GAMLIEL_PREVIEW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Google Drive client dependencies
        run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Check one-record review guardrails
        run: |
          python -m py_compile dropbox_approve.py
          python -m unittest discover -s tests -p 'test_dropbox_approve.py' -v
      - name: Approve exactly one imported recording
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python -u dropbox_approve.py \
            --id 'dbx-media-b10df8d9b922db4b49f24e64' \
            --source-label 'Reb Gamliel Rabinowitz' \
            --path '/נשא (חול) - בהעלותך תשפ-ג/with subtitles.mp4' \
            --speaker 'Reb Gamliel Rabinowitz' \
            --title 'נשא (חול) - בהעלותך תשפ-ג' \
            --year 5783 \
            --series 'Parsha' \
            --parsha "Beha'alotcha"
